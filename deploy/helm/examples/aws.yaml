# a5s on AWS: EKS, RDS or Aurora for PostgreSQL, Okta and Slack (docs/first-day.md has each
# provider's settings side by side). Fill each <...>, and install with
# `helm install a5s deploy/helm/a5s -n a5s -f aws.yaml`. The Secret's keys are in
# deploy/helm/README.md; `python3 deploy/reach-check.py` checks first that the cluster reaches
# what a5s needs.

environment:  # as a band across the top of every page says it: production once real people use it
  kind: test
  name: Pilot test

image:  # the deployment's own image, built on the release's, by its digest (step 5)
  repository: <account>.dkr.ecr.<region>.amazonaws.com/a5s
  digest: sha256:<the push's digest>

people:  # Okta (step 2)
  oidcIssuer: https://<org>.okta.com/oauth2/default
  webchatClientId: <the a5s app's client id>
  oidcPersonClaim: sub  # or the claim the directory knows people by
  oidcMfa: amr:mfa  # with a sign-on policy that asks for a second factor
  oidcGroupsClaim: groups
  publicUrl: https://<host>

slack:  # an app for each agent: `python3 deploy/chat-apps.py slack` makes its manifest (step 3)
  teamId: <the workspace's team id>
  apps:
    - {agent: assistant, appId: <the assistant's app id>}
    - {agent: watcher, appId: <the watcher's app id>}

anchor:  # a bucket made with Object Lock (step 4)
  store: s3://<bucket>/a5s
serviceAccounts:
  annotations:
    anchor: {eks.amazonaws.com/role-arn: <a role that may write the bucket>}

networkPolicies:
  database:
    cidrs: ["<the database's subnets, such as 10.0.16.0/20>"]

ingress:
  enabled: true
  className: alb  # or the cluster's ingress controller's class
  host: <host>
  tlsSecret: <the certificate's Secret>
