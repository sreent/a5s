{{- range $part := list "gateway" "channels" "scheduler" "anchor" "worker" }}
---
# The {{ $part }}'s own identity, for its cloud's workload identity if it needs one: it can't
# reach Kubernetes' own API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $.Release.Name $part }}
  labels:
    {{- include "a5s.labels" $ | nindent 4 }}
  {{- with (get $.Values.serviceAccounts.annotations $part) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
