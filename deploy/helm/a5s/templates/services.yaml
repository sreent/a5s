{{- $ports := dict "gateway" 8700 "channels" 8703 "worker" 8702 }}
{{- range include "a5s.pooled" . | fromJsonArray }}
{{- $_ := set $ports (printf "worker-%s" .) 8702 }}
{{- end }}
{{- range $part, $port := $ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" $.Release.Name $part }}
  labels:
    {{- include "a5s.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $part }}
spec:
  selector:
    {{- include "a5s.selector" (dict "root" $ "part" $part) | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
