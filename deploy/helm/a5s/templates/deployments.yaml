{{- if ne .Values.mode "sandbox" }}
{{- $parts := list
  (dict "part" "gateway" "args" (list "gateway" "--host" "0.0.0.0") "port" 8700)
  (dict "part" "channels" "args" (list "channels" "--host" "0.0.0.0") "port" 8703)
  (dict "part" "scheduler" "args" (list "scheduler") "port" 0)
  (dict "part" "anchor" "args" (list "anchor" "--every") "port" 0)
  (dict "part" "worker" "role" "worker" "args" (list "worker" "--host" "0.0.0.0") "port" 8702
        "pooled" (include "a5s.pooled" . | fromJsonArray)) }}
{{- /* and each agent's own worker pool, which runs its runs alone (workers.pools) */}}
{{- range $agent := include "a5s.pooled" . | fromJsonArray }}
{{- $pool := get $.Values.workers.pools $agent | default dict }}
{{- $parts = append $parts (dict "part" (printf "worker-%s" $agent) "role" "worker"
      "args" (list "worker" "--host" "0.0.0.0") "port" 8702 "agents" (list $agent)
      "replicas" ($pool.replicas | default $.Values.workers.replicas)
      "resources" ($pool.resources | default $.Values.resources.worker)) }}
{{- end }}
{{- range $parts }}
{{- $part := .part }}
{{- $role := .role | default $part }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $.Release.Name $part }}
  labels:
    {{- include "a5s.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $part }}
spec:
  replicas: {{ .replicas | default 1 }}
  {{- if has $role (list "worker" "gateway" "channels") }}
  # A new pod is ready, its image pulled however long that takes, before an old one stops, so
  # the part is never away on an upgrade, and the old one finishes what it has in flight first
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  {{- else }}
  # The old one stopped first, so two schedulers or copiers never overlap
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "a5s.selector" (dict "root" $ "part" $part) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "a5s.podLabels" (dict "root" $ "part" $part) | nindent 8 }}
    spec:
      serviceAccountName: {{ printf "%s-%s" $.Release.Name $role }}
      {{- if eq $role "worker" }}
      terminationGracePeriodSeconds: {{ $.Values.timeouts.workerWait }}  # its runs in flight
      {{- else if eq $role "scheduler" }}
      terminationGracePeriodSeconds: {{ add $.Values.timeouts.workerWait 30 }}  # and its sweeps
      {{- else if eq $role "gateway" }}
      terminationGracePeriodSeconds: {{ add $.Values.timeouts.provider 15 }}  # a model call in flight
      {{- end }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: {{ $part }}
          image: {{ include "a5s.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: {{ toJson .args }}
          {{- if .port }}
          lifecycle:  # a moment for its Service to stop sending it work, before it stops taking it
            preStop:
              exec:
                command: ["sleep", "5"]
          {{- end }}
          securityContext:
            {{- include "a5s.securityContext" $ | nindent 12 }}
          env:
            {{- include "a5s.scratch" $ | nindent 12 }}
            {{- include (printf "a5s.env.%s" $role) $ | nindent 12 }}
            {{- with .agents }}
            - name: A5S_WORKER_AGENTS  # the agent this pool runs, alone
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .pooled }}
            - name: A5S_WORKER_POOLED  # those with pools of their own, which it refuses
              value: {{ join "," . | quote }}
            {{- end }}
          {{- if .port }}
          ports:
            - name: http
              containerPort: {{ .port }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- end }}
          resources:
            {{- toYaml (.resources | default (get $.Values.resources $role)) | nindent 12 }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            {{- if and (eq $part "gateway") $.Values.models.configMap }}
            - name: models
              mountPath: /app/config/models.yaml
              subPath: models.yaml
              readOnly: true
            {{- end }}
      volumes:
        - name: scratch
          emptyDir: {}
        {{- if and (eq $part "gateway") $.Values.models.configMap }}
        - name: models
          configMap:
            name: {{ $.Values.models.configMap }}
        {{- end }}
{{- end }}
{{- end }}
