{{- if ne .Values.mode "sandbox" }}
{{- if .Values.ingress.enabled }}
# The only way in from outside the cluster: to the channels, where people and their chats reach a5s.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-channels" .Release.Name }}
  labels:
    {{- include "a5s.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ required "set ingress.host" .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ required "set ingress.host" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-channels" .Release.Name }}
                port:
                  name: http
{{- end }}
{{- end }}
