{{/* The jobs that run as the database's administrator: setting up the schema and applying the
signed settings before each install or upgrade, and recording a release's approval after. They
run as Helm hooks, with their own account and network policy, made first. */}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-admin" .Release.Name }}
  labels:
    {{- include "a5s.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-admin" .Release.Name }}
  labels:
    {{- include "a5s.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "a5s.selector" (dict "root" . "part" "admin") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "a5s.policy.dns" . | nindent 4 }}
    {{- include "a5s.policy.database" . | nindent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-setup" .Release.Name }}
  labels:
    {{- include "a5s.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    {{- include "a5s.adminPod" (dict "root" . "args" (list "setup") "passwords" true "approval" false) | nindent 4 }}
{{- if .Values.release.approval }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-approve" .Release.Name }}
  labels:
    {{- include "a5s.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    {{- include "a5s.adminPod" (dict "root" . "args" (list "release" "approve" "--manifest" "/approval/release.yaml" "--signatures" "/approval/release.sig") "passwords" false "approval" true) | nindent 4 }}
{{- end }}
