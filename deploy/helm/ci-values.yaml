# The chart as its test installs it (test.sh): the image built here, Postgres beside it in the
# cluster, and the ledger's copies in a folder, since this cluster has no locked storage.
image:
  repository: a5s
  tag: dev
  pullPolicy: Never

anchor:
  store: file:///tmp/ledger

networkPolicies:
  database:
    podSelector:
      matchLabels:
        app: postgres

# Its sandbox, which test.sh installs as a second release, in the namespace a5s-sandbox: for
# a5s's release, where it is, and for the sandbox's, a5s's namespace, whose channels reach it.
sandbox:
  url: http://a5s-sandbox.a5s-sandbox:8710
  namespace: a5s-sandbox
  studio:
    namespace: a5s

# A label on the copier's pods, as some clouds' workload identity needs, such as AKS's (test.sh checks it).
podLabels:
  anchor:
    a5s.test/workload-identity: "on"
