# The service desk's made-up ITSM, identity provider and device management, each behind its MCP
# server (systems/itsm.py, idp.py and mdm.py), on the desk's synthetic data. They share the
# gateway's network namespace, as the desk's mcp.yaml points a5s at them on the gateway's own
# loopback, the one place a5s calls a server over plain HTTP: so they reach what the gateway
# reaches, which only made-up data makes acceptable, and a real one runs on its own host, over
# HTTPS. What's done through device management, such as a lock its decider approved, it keeps in a
# volume a5s's parts read, as the scenario's own code reads it as it stands:
#   sh deploy/smoke-scenario.sh service-desk
# With the studio's sandbox (compose.sandbox.yaml), its profile runs the sandbox's own copies in
# the sandbox's network, so nothing tried there changes these:
#   docker compose ... -f deploy/compose.desk.yaml -f deploy/compose.sandbox.yaml --profile sandbox up -d

x-desk-system: &desk-system
  image: ${A5S_IMAGE:-a5s:dev}
  restart: unless-stopped  # and again with the gateway, whose network they share
  volumes: ["./systems:/systems:ro"]
  network_mode: "service:gateway"
  depends_on:
    gateway: {condition: service_started, restart: true}

x-reads-mdm: &reads-mdm
  environment: {A5S_SYSTEMS_STATE: /state}
  volumes: ["systems-state:/state:ro"]

x-desk-sandbox: &desk-sandbox  # the sandbox's own, on the addresses its mcp.yaml gives the sandbox
  image: ${A5S_IMAGE:-a5s:dev}
  profiles: [sandbox]
  restart: unless-stopped
  volumes: ["./systems:/systems:ro"]
  network_mode: "service:sandbox"
  depends_on:
    sandbox: {condition: service_started, restart: true}

services:
  desk-itsm:
    <<: *desk-system
    entrypoint: ["python", "/systems/itsm.py", "/app/scenarios/service-desk/data.yaml"]
  desk-idp:
    <<: *desk-system
    entrypoint: ["python", "/systems/idp.py", "/app/scenarios/service-desk/data.yaml"]
  desk-itsm-sandbox:
    <<: *desk-sandbox
    entrypoint: ["python", "/systems/itsm.py", "/app/scenarios/service-desk/data.yaml"]
    environment: {A5S_SYSTEM_PORT: "9301"}
  desk-idp-sandbox:
    <<: *desk-sandbox
    entrypoint: ["python", "/systems/idp.py", "/app/scenarios/service-desk/data.yaml"]
    environment: {A5S_SYSTEM_PORT: "9302"}
  systems-state:  # device management's folder in the volume, its own to write in
    image: ${A5S_IMAGE:-a5s:dev}
    user: "0"
    entrypoint: ["chown", "10001:10001", "/state"]
    volumes: ["systems-state:/state"]
  desk-mdm:
    <<: *desk-system
    entrypoint: ["python", "/systems/mdm.py", "/app/scenarios/service-desk/data.yaml"]
    environment: {A5S_SYSTEMS_STATE: /state}
    volumes: ["./systems:/systems:ro", "systems-state:/state"]
    depends_on:
      gateway: {condition: service_started, restart: true}
      systems-state: {condition: service_completed_successfully}
  desk-mdm-sandbox:
    <<: *desk-sandbox
    entrypoint: ["python", "/systems/mdm.py", "/app/scenarios/service-desk/data.yaml"]
    environment: {A5S_SYSTEMS_STATE: /state, A5S_SYSTEM_PORT: "9305"}
    volumes: ["./systems:/systems:ro", "sandbox-systems-state:/state"]
    depends_on:
      sandbox: {condition: service_started, restart: true}
      sandbox-systems-state: {condition: service_completed_successfully}
  gateway: *reads-mdm
  channels: *reads-mdm
  scheduler: *reads-mdm

volumes:
  systems-state: {}
