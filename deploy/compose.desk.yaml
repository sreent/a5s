# The service desk's made-up ITSM and identity provider, each behind its MCP server (desk/itsm.py
# and desk/idp.py), on the desk's synthetic data. They share the gateway's network, as the desk's
# mcp.yaml points a5s at them on the gateway's own machine, and reach nothing else:
#   sh deploy/smoke-scenario.sh service-desk

services:
  desk-itsm:
    image: ${A5S_IMAGE:-a5s:dev}
    entrypoint: ["python", "/desk/itsm.py", "/app/scenarios/service-desk/data.yaml"]
    volumes: ["./desk:/desk:ro"]
    network_mode: "service:gateway"
    depends_on: [gateway]
  desk-idp:
    image: ${A5S_IMAGE:-a5s:dev}
    entrypoint: ["python", "/desk/idp.py", "/app/scenarios/service-desk/data.yaml"]
    volumes: ["./desk:/desk:ro"]
    network_mode: "service:gateway"
    depends_on: [gateway]
