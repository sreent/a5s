# The software delivery team's made-up forge, with its CI, behind its MCP server (systems/forge.py),
# on the scenario's synthetic data. It shares the gateway's network namespace, as the scenario's
# mcp.yaml points a5s at it on the gateway's own loopback, the one place a5s calls a server over
# plain HTTP: so it reaches what the gateway reaches, which only made-up data makes acceptable, and
# a real forge runs on its own host, over HTTPS. Whom it's asked to review a pull request it keeps
# in a volume a5s's parts read, as the scenario's own code reads the forge as it stands, and it
# carries on from there when it starts again:
#   sh deploy/smoke-scenario.sh software-delivery
# With the studio's sandbox (compose.sandbox.yaml), its profile runs the sandbox's own copy in the
# sandbox's network, with its own state, so nothing tried there changes this forge:
#   docker compose ... -f deploy/compose.delivery.yaml -f deploy/compose.sandbox.yaml --profile sandbox up -d

x-reads-forge: &reads-forge
  environment: {A5S_SYSTEMS_STATE: /state}
  volumes: ["systems-state:/state:ro"]

services:
  systems-state:  # the made-up system's folder in the volume, its own to write in
    image: ${A5S_IMAGE:-a5s:dev}
    user: "0"
    entrypoint: ["chown", "10001:10001", "/state"]
    volumes: ["systems-state:/state"]
  delivery-forge:
    image: ${A5S_IMAGE:-a5s:dev}
    restart: unless-stopped  # and again with the gateway, whose network it shares
    entrypoint: ["python", "/systems/forge.py", "/app/scenarios/software-delivery/data.yaml"]
    environment: {A5S_SYSTEMS_STATE: /state}
    volumes: ["./systems:/systems:ro", "systems-state:/state"]
    network_mode: "service:gateway"
    depends_on:
      gateway: {condition: service_started, restart: true}
      systems-state: {condition: service_completed_successfully}
  delivery-forge-sandbox:  # the sandbox's own, on the address its mcp.yaml gives the sandbox
    image: ${A5S_IMAGE:-a5s:dev}
    profiles: [sandbox]
    restart: unless-stopped
    entrypoint: ["python", "/systems/forge.py", "/app/scenarios/software-delivery/data.yaml"]
    environment: {A5S_SYSTEMS_STATE: /state, A5S_SYSTEM_PORT: "9303"}
    volumes: ["./systems:/systems:ro", "sandbox-systems-state:/state"]
    network_mode: "service:sandbox"
    depends_on:
      sandbox: {condition: service_started, restart: true}
      sandbox-systems-state: {condition: service_completed_successfully}
  gateway: *reads-forge
  channels: *reads-forge
  scheduler: *reads-forge

volumes:
  systems-state: {}
