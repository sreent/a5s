<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a5s: settings to approve</title>
<link rel="stylesheet" href="/chat/app.css">
<script src="/chat/shell.js" defer></script>
<script src="/approve/approve.js" defer></script>
</head>
<body>
<header>
  <p class="site-name">a5s</p>
  <span id="who"></span>
</header>
<main>
  <h1>Settings to approve</h1>
  <p id="status" role="status"></p>
  <section id="version" hidden>
    <p id="summary"></p>
    <ul id="changes"></ul>
    <p id="approvals"></p>
    <p id="needs" class="note" hidden></p>
    <h2>The whole version</h2>
    <ul id="whole" class="plain"></ul>
    <p class="note">Approve only if you mean these changes. Your sign-in approves this version
      alone, and only once.</p>
    <button id="approve" class="primary" type="button" hidden>Approve</button>
  </section>
</main>
</body>
</html>
