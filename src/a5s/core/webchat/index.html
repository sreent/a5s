<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a5s</title>
<link rel="stylesheet" href="/chat/ocean/css/tokens.css">
<link rel="stylesheet" href="/chat/ocean/css/components.css">
<link rel="stylesheet" href="/chat/app.css">
<script src="/chat/shell.js" defer></script>
<script src="/chat/app.js" defer></script>
</head>
<body>
<header>
  <p class="site-name">a5s</p>
  <label>Agent <select id="agent"></select></label>
  <span id="who"></span>
  <button id="signout" type="button" hidden>Sign out</button>
</header>
<main>
  <h1 class="hidden">Chat</h1>  <!-- the conversation is the page: its name is for screen readers -->
  <p id="status" role="status"></p>
  <button id="rename" type="button" hidden>Say who you are again</button>
  <form id="name" hidden>
    <label>Who are you? In development, a5s takes your word for it.
      <input id="person" autocomplete="off" required></label>
    <button class="primary">Start</button>
  </form>
  <div id="welcome" class="welcome" hidden></div>
  <ol id="conversation" aria-live="polite"></ol>
</main>
<footer>
  <div id="composer">
  <p id="refused" class="problem-note" role="alert"></p>
  <ul id="attached" class="chips" aria-label="Files to send with your message" hidden></ul>
  <form id="compose" hidden>
    <button type="button" id="attach" aria-label="Attach files" title="Attach text files, PDFs or images"></button>
    <input id="files" type="file" multiple hidden accept=".txt,.csv,.md,.json,.pdf,.png,.jpg,.jpeg,.gif,.webp">
    <label for="text" class="hidden">Your message</label>
    <textarea id="text" rows="2" placeholder="Write to the agent. Enter sends, Shift+Enter starts a new line."></textarea>
    <button class="primary">Send</button>
  </form>
  </div>
</footer>
</body>
</html>
