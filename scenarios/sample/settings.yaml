# The sample scenario's settings: which instances exist, whom each serves, the parts of the
# business each works in, and how far each may act there. A version counts only when the
# owner of each part its instances work in signs it (`a5s sign`), and an instance approver
# for any instance in no part. Its serial must rise with every new version.

serial: 7

# Every record here is made up, so models approved only for made-up data may see it.
# A real scenario names its own class, such as internal, and any fields of a class of
# their own, such as contact: personal, which only models approved for it see.
data_class: synthetic
classified: {}

# The scenario's limits for each type of change: how many one run may ask for, and how many
# for each person in 30 days. Past one, a change waits for the owner of its part to decide
# it, whatever the level. Each instance's level for a type of change in a part, such as
# parts: {billing: {level: 1, actions: {change-due-date: 2}}}, is the only way to level 2,
# and a5s holds it at level 1 until graded samples of the release's work raise its cap.
limits:
  change-due-date: {per_run: 5, per_person_30_days: 20}
  close-question: {per_run: 5, per_person_30_days: 20}

# How accurate an agent's changes in each part must be, as graded samples show, before a5s
# raises its cap there to level 2. A part with none never earns it.
thresholds:
  billing: 0.98
  orders: 0.95

instances:
  assistant-finance:
    definition: assistant
    serves: [ana, ben]
    parts: [billing]  # the parts it works in, whose owners approve it: Ana owns billing
    level: 1         # in each of them, unless a part says otherwise: it drafts, people decide
    owner: ana       # who runs it here, and their deputy
    deputy: ben
  watcher-finance:
    definition: watcher
    serves: [ana, ben]
    parts: [billing]
    level: 0         # it observes and reports
    owner: ana
    deputy: ben
