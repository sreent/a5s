  - {key: Q-1002, title: Refund for a duplicate payment, status: waiting on finance, customer: Contoso, owner: ben, opened: "2026-10-27", due: "2026-11-06"}
  - {key: Q-1003, title: Delivery date for order 7781, status: open, customer: Fabrikam, owner: chen, opened: "2026-10-26", due: "2026-11-02"}
  - {key: Q-1004, title: Change of billing contact, status: closed, customer: Northwind, owner: ana, opened: "2026-10-12", due: "2026-10-20"}
