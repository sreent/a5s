# SAP MDG's change requests and master records, through its MCP server (docs/connectors.md#mcp-servers).
# In this made-up organisation it's deploy/systems/sap.py, on the scenario's synthetic data, beside
# the gateway on its own machine, and the same stand-in answers in the studio's sandbox. a5s offers
# its agents nothing of the server's but the tools declared here, in a5s's words, and passes on only
# the fields each names: bank details only as handles, and what suppliers sent only through a5s's
# reader. Code's checks of a request, and of each data object's quality, are the scenario's own.
servers:
  sap:
    url: http://127.0.0.1:9204/mcp
    sandbox: http://127.0.0.1:9204/mcp
tools:
  search_records:
    server: sap
    calls: search_master_data
    description: Search change requests and master records by words in their title, status, name or description.
    arguments: {type: object, required: [query], properties: {query: {type: string}}}
    returns: [found, key, object, kind, record, title, values, status, requester, steward, opened, due, name, country, postcode, vat, supplier, iban, payment_terms, description, base_unit, material_type, link]
    handles: [iban]
    record_field: key
  get_record:
    server: sap
    calls: read_master_data
    description: Get one change request, with the values it proposes, or one master record. Bank details come as handles, never their values.
    arguments: {type: object, required: [key], properties: {key: {type: string, description: "A change request, such as CR0000101, or a master record, such as S-100045"}}}
    returns: [key, object, kind, record, title, values, status, requester, steward, opened, due, name, country, postcode, vat, supplier, iban, payment_terms, description, base_unit, material_type, link]
    handles: [iban]
    record_arg: key
    record_field: key
  get_letters:
    server: sap
    calls: change_request_attachments
    description: "Get what suppliers and customers sent with a change request, through a5s's reader: what it asks for, and the dates and keys it names, never its words."
    arguments: {type: object, required: [key], properties: {key: {type: string, description: "A change request, such as CR0000102"}}}
    returns: [key, letters, record, from, at, body]
    handles: [from]
    outside: [body]
    record_arg: key
    record_field: key
    # what it asks for, and the handbook's warning signs
    extract: {asks_for: "choice:a bank change|an address change|a new record|a blocked record|something else", date: date, request: key, says_it_is_urgent: flag, asks_to_skip_the_callback: flag, says_someone_approved_it_already: flag}
  # A change: a5s holds each for the owner of the request's data object, its part, below level 2,
  # and makes it once they approve it, if the request hasn't changed since, once for a5s's key,
  # which the server honours. Its schema has no sensitive field, nor a country, which decides the
  # VAT rule a number is checked by, so an agent can't even propose one
  correct_value:
    server: sap
    calls: update_change_request
    description: "Propose a correction to what a change request proposes, such as a missing base unit, for its data object's owner to decide. A sensitive field, such as bank details, a VAT number, payment terms or a supplier's name, is never corrected this way: its requester changes it, and the owner confirms it."
    arguments: {type: object, required: [key], additionalProperties: false, properties: {key: {type: string, description: The change request}, description: {type: string, minLength: 1}, base_unit: {type: string, enum: [EA, PC, KG, M, L], description: "Each, piece, kilogram, metre or litre"}, material_type: {type: string, enum: [ROH, HALB, FERT], description: "Raw, semi-finished or finished"}}}
    returns: [key, values, description, base_unit, material_type, status, link]
    writes: true
    idempotent: true
    record_arg: key
    record_field: key
    action: correct-value
