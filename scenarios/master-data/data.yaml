# Each data object, the team of its one named owner, who else sees its records, and the share
# of its records that must pass every critical-field rule, as last measured, with the date by
# which its owner brings it back.
objects:
  supplier: {name: Supplier general data, team: procurement-data, seen_by: [procurement, accounts-payable], target: 0.98, measured: "2026-11-02", fix_by: "2026-11-13"}
  supplier-bank: {name: Supplier bank and payment data, team: finance-data, seen_by: [accounts-payable], target: 0.98, measured: "2026-11-02", fix_by: "2026-11-13"}
  customer: {name: Customer data, team: commercial-data, seen_by: [sales], target: 0.98, measured: "2026-11-02", fix_by: "2026-11-13"}
  material: {name: Material data, team: manufacturing-data, seen_by: [plant], target: 0.95, measured: "2026-11-02", fix_by: "2026-11-20"}

