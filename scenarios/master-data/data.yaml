  - {key: CR0000101, object: supplier, kind: create, title: Create supplier Northwind Components, values: {name: Northwind Components, country: DE, postcode: "10115", vat: DE123456789}, status: in review, requester: bea, steward: tess, opened: "2026-11-03", due: "2026-11-05"}
  - {key: CR0000102, object: supplier-bank, kind: change, record: B-100012, title: Change Contoso Supplies' bank account, values: {iban: GB29NWBK60161331926819}, status: awaiting owner, requester: ada, steward: tess, opened: "2026-11-03", due: "2026-11-05"}
