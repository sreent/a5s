id: mdg-assistant
release: 0.1.0
works_for: Requesters, data stewards and data object owners, within SAP master data governance
does: >-
  Checks change requests and data quality by code, answers from SAP's master data
  and the governance handbook, proposes corrections for each data object's owner
  to decide, saves drafts such as a note to a requester or a quality report, and
  chases the next step of each request, and each owner's quality fixes, as they
  fall due.
scope: none
model: deepseek-v4-pro
autonomy:
  start: 1
  max: 1
tools:
  records: [search_records, get_record, get_letters, check_request, check_quality]
  knowledge: [search_knowledge, read_knowledge]
  documents: [create_draft]
  changes: [correct_value]
triggers:
  - message: from the requester, data steward or data object owner it works for
obligations: [records, quality]
schedules: []
reminders: true
preferences: [digest-time, how-i-work]
channels: [matrix, teams]
context:
  budget_tokens: 24000
  recall: true
  documents: false  # a letter reaches it only as its form, which code checks: never in words,
  # which could hold a bank account's number
  agents: false
tasks:
  budget_tokens: 120000
  days: 2
budget:
  per_run: 200000
  per_person_per_day: 1000000
