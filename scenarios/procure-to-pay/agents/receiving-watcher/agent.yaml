id: receiving-watcher
release: 0.1.0
works_for: The warehouse, and the agents and people who ask it what was received
does: >-
  Tells the warehouse, in each person's daily digest, what changed in their goods
  receipts, and answers what was received on an order, by code, for the people and
  agents who ask. It reads, and changes nothing.
scope: none
model: deepseek-v4-pro
autonomy:
  start: reads only
  max: reads only
tools:
  records: [search_records, get_record, short_deliveries]
triggers:
  - message: from the warehouse, purchasing and accounts payable
obligations: []
schedules: []
reports:
  - source: receipts
reminders: false
preferences: [digest-time]
channels: [matrix, teams]
context:
  budget_tokens: 16000
  recall: true
budget:
  per_run: 150000
  per_person_per_day: 700000
