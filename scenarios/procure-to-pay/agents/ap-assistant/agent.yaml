id: ap-assistant
release: 0.1.0
works_for: Accounts payable and finance's controller
does: >-
  Matches suppliers' invoices with their purchase orders and what the warehouse
  received, by code; asks for each invoice that matches to be approved for payment,
  which payables' deciders decide, two of them above the settings' amount; corrects
  the order an invoice names where the match shows the one it means; asks the
  warehouse's watcher what it can't see; hands a dispute to accounts payable; and
  works through a month's invoices as a task, in parts.
scope: none
model: deepseek-v4-pro
fallbacks: [deepseek-v4-pro-anthropic]  # the same model, its other API, on the same key
autonomy:
  start: asks first
  max: acts on its own  # a correction of an invoice's order, only as its settings and graded samples give it: never a payment, which its pack keeps for people
tools:
  records: [search_records, get_record, get_invoice_documents, match_invoice]
  knowledge: [search_knowledge, read_knowledge]
  documents: [create_draft]
  changes: [approve_invoice, correct_invoice_order]
triggers:
  - message: from accounts payable and finance's controller
obligations: [records]
schedules: []
events:
  - source: erp
    type: goods-received
    task: >-
      The warehouse booked in goods on the orders this event names. Match each invoice on
      those orders again with match_invoice, and ask for each that now matches to be approved
      for payment with approve_invoice. Ask for nothing that doesn't match.
reminders: true
preferences: [digest-time, how-i-work]
channels: [matrix, teams]
context:
  budget_tokens: 24000
  recall: true
  documents: false  # what a supplier sent reaches it only as its form, never its words, which
  # could hold a bank account or an instruction
  agents: true  # it asks the warehouse's watcher
  handover: true  # a dispute goes to accounts payable's people, in the same chat
tasks:
  budget_tokens: 200000
  days: 2
budget:
  per_run: 200000
  per_person_per_day: 1500000
