id: desk-assistant
release: 0.1.0
works_for: Employees and service-desk resolvers, within their ticket and knowledge permissions
does: >-
  Answers questions about ITSM tickets and approved knowledge articles, saves
  draft replies for people to review, and follows up on work that falls due.
scope: none
model: deepseek-v4-pro
autonomy:
  start: 1
  max: 1
tools:
  records: [search_records, get_record, get_messages]
  knowledge: [search_knowledge, read_knowledge]
  documents: [create_draft]
triggers:
  - message: from the employee or resolver it works for
obligations: [records]
schedules: []
reminders: true
preferences: [digest-time, how-i-work]
channels: [matrix, teams]
context:
  budget_tokens: 24000
  recall: true
  documents: true
  agents: false
budget:
  per_run: 200000
  per_person_per_day: 1000000
