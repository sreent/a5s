# The desk's ITSM, its identity provider's self-service and its device management, each through its
# MCP server (docs/connectors.md#mcp-servers). In this made-up desk they're deploy/systems/itsm.py,
# idp.py and mdm.py, on the desk's synthetic data, beside the gateway on its own machine, and copies of
# their own answer in the studio's sandbox, beside it, so nothing tried there changes the
# deployment's. a5s offers its agents nothing of the servers' but the tools declared here, in a5s's
# words, and passes on only the fields each names.
servers:
  itsm:
    url: http://127.0.0.1:9201/mcp
    sandbox: http://127.0.0.1:9301/mcp  # the sandbox's own copy, with its own state
  idp:
    url: http://127.0.0.1:9202/mcp
    sandbox: http://127.0.0.1:9302/mcp  # the sandbox's own copy, with its own state
  mdm:
    url: http://127.0.0.1:9205/mcp
    sandbox: http://127.0.0.1:9305/mcp  # the sandbox's own copy, with its own state
tools:
  search_records:
    server: itsm
    calls: search_tickets
    description: Search ITSM tickets by words in their title.
    arguments: {type: object, required: [query], properties: {query: {type: string}}}
    returns: [tickets, key, part, title, status, requester, assignee, contact, opened, due, link]
    record_field: key
    handles: [contact]
  get_record:
    server: itsm
    calls: get_ticket
    description: Get one ITSM ticket by its key, such as INC0000001.
    arguments: {type: object, required: [key], properties: {key: {type: string}}}
    returns: [key, part, title, status, requester, assignee, contact, opened, due, link]
    record_arg: key
    record_field: key
    handles: [contact]
  get_messages:
    server: itsm
    calls: ticket_comments
    description: Get what requesters wrote on a ticket through a5s's reader.
    arguments: {type: object, required: [key], properties: {key: {type: string}}}
    returns: [key, messages, record, from, at, body]
    record_arg: key
    record_field: key
    handles: [from]
    outside: [body]
    extract: {asks_for: "choice:a reset|access|equipment|something else"}
  # A change: a5s holds each for the decider of the ticket's service area, where the agent asks
  # first, and makes it once they approve it, once for a5s's key, which the server honours
  reply_on_ticket:
    server: itsm
    calls: add_reply
    description: Post a reply on an ITSM ticket, which its requester reads.
    arguments: {type: object, required: [key, body], properties: {key: {type: string}, body: {type: string, maxLength: 4000}}}
    returns: [key, replied, at, link]
    writes: true
    idempotent: true
    record_arg: key
    record_field: key
    action: reply
    text_fields: [body]
  # Self-service, through the identity provider: each account is ACC- and its holder's id. A reset
  # is the provider's own flow, which its holder finishes there, verifying themselves, so the
  # agent never sees a secret. The desk's pack lets a reset run on its own only for the person
  # asking, and never an authenticator change (service_desk.py's PACK)
  get_account:
    server: idp
    calls: get_account
    description: Get an account in the identity provider by its key, such as ACC-sam, the holder's id after ACC-.
    arguments: {type: object, required: [key], properties: {key: {type: string}}}
    returns: [key, holder, state, authenticators, link]
    record_arg: key
    record_field: key
  reset_password:
    server: idp
    calls: start_password_reset
    description: Start the identity provider's own password reset for an account, which its holder finishes there, verifying themselves.
    arguments: {type: object, required: [key], properties: {key: {type: string}}}
    returns: [key, flow, link]
    writes: true
    idempotent: true
    record_arg: key
    record_field: key
    action: reset-password
  reset_authenticators:
    server: idp
    calls: reset_authenticators
    description: Remove an account's authenticators in the identity provider, so its holder registers new ones when they next sign in.
    arguments: {type: object, required: [key], properties: {key: {type: string}}}
    returns: [key, removed, link]
    writes: true
    destructive: true
    idempotent: true
    record_arg: key
    record_field: key
    action: reset-authenticators
  # Devices, through device management: each person's, by its asset tag, LT- for a laptop and PH-
  # for a phone, in hardware. A remote lock is a change a5s holds for hardware's decider where the
  # agent asks first, and makes once they approve it, once for a5s's key. The desk's pack lets it
  # run on its own only for the person asking, on their own device, as a reset does
  search_devices:
    server: mdm
    calls: search_devices
    description: Search devices by words in their asset tag, kind, holder, model or system, such as laptop or sam.
    arguments: {type: object, required: [query], properties: {query: {type: string}}}
    returns: [devices, key, kind, holder, model, os, compliant, reasons, last_seen, locked, link]
    record_field: key
  get_device:
    server: mdm
    calls: get_device
    description: "Get a device by its asset tag, such as LT-0042: its holder, model and system, whether it meets the organisation's rules for devices and why not, and whether it's locked."
    arguments: {type: object, required: [key], properties: {key: {type: string}}}
    returns: [key, kind, holder, model, os, compliant, reasons, last_seen, locked, link]
    record_arg: key
    record_field: key
  lock_device:
    server: mdm
    calls: lock_device
    description: Lock a device remotely, such as one that's lost, so nobody can use it, at once if it's connected, else once it next connects.
    arguments: {type: object, required: [key], properties: {key: {type: string}}}
    returns: [key, locked, state, link]
    made: {locked: true}  # else device management has it in hand, until the device connects
    writes: true
    idempotent: true
    record_arg: key
    record_field: key
    action: lock-device
