[project]
name = "a5s"
version = "0.1.0"
description = "An agent OS on LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.32",
    "langchain==1.4.7",
    "langchain-openai",
    "langchain-anthropic",
    "cedarpy==4.12.2",
    "fastapi",
    "uvicorn",
    "httpx",
    "httpx2",  # the model providers' SDKs take it in httpx's place
    "psycopg[binary]",
    "pydantic>=2",
    "pyyaml",
    "pyjwt[crypto]>=2.15.1",
    "boto3>=1.43.121",
    "azure-storage-blob>=12.31.0",
    "azure-identity>=1.27.0",
    "google-cloud-storage>=3.17.1",
    "tzdata>=2026.6",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "psycopg-pool>=3.2.6",
]

[project.scripts]
a5s = "a5s.cli:main"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "moto[s3]>=5.2.5",
    "playwright==1.63.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a5s"]
# The studio's pages, which `npm run build` in studio/ builds and git leaves out
artifacts = ["src/a5s/core/webchat/studio/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model provider; needs its API key"]
addopts = "-m 'not live'"

[tool.basedpyright]
# Static type checking: pyright, at its standard strictness, over a5s's own code, in CI beside
# ruff. What it found when it was added is in .basedpyright/baseline.json, which only shrinks
# as those are fixed; anything new fails.
include = ["src/a5s"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
