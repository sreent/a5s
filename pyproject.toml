[project]
name = "a5s"
version = "0.1.0"
description = "An agent OS on LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.32",
    "langchain==1.4.7",
    "langchain-openai",
    "langchain-anthropic",
    "cedarpy==4.12.2",
    "fastapi",
    "uvicorn",
    "httpx",
    "psycopg[binary]",
    "pydantic>=2",
    "pyyaml",
    "pyjwt[crypto]>=2.15.1",
    "boto3>=1.43.121",
    "azure-storage-blob>=12.31.0",
    "azure-identity>=1.27.0",
    "google-cloud-storage>=3.17.1",
    "tzdata>=2026.6",
]

[project.scripts]
a5s = "a5s.cli:main"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a5s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model provider; needs its API key"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
