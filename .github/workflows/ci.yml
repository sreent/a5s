name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: a5s
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U a5s"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      A5S_TEST_DATABASE_URL: postgresql://a5s@127.0.0.1:5432/postgres
      A5S_TEST_AZURITE: UseDevelopmentStorage=true
      A5S_TEST_GCS: http://127.0.0.1:4443
    steps:
      - uses: actions/checkout@v4
      - name: Start emulators for Azure's and Google's storage
        run: |
          docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          docker run -d -p 4443:4443 mirror.gcr.io/fsouza/fake-gcs-server:1.52 \
            -scheme http -port 4443 -external-url http://127.0.0.1:4443
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t a5s:dev .
      - run: sh deploy/smoke.sh
