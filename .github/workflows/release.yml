name: release

# A release of a5s, on a version tag such as v0.2.0: the full suite, and each agent's own
# regression suite against the model its release names, then the image, built,
# smoke-tested, pushed with its provenance signed, and published with the manifest it was
# built with. Each organisation then approves the release for its
# own deployment, by signing what `a5s release show` prints there.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  agents:  # each agent's own regression suite, against the model its release names
    needs: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: a5s
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U a5s"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      A5S_TEST_DATABASE_URL: postgresql://a5s@127.0.0.1:5432/postgres
      A5S_REGRESSION: required  # a missing key fails the release, rather than skipping
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}  # with the sample's made-up data only
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --locked
      - run: uv run pytest -m live tests/test_agents.py

  image:
    needs: [ci, agents]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the release
      packages: write  # to push the image
      id-token: write  # to sign its provenance
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: The tag names the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't name version $version."; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build the image, and run the smoke test against it
        run: |
          docker build -t "$IMAGE:$VERSION" .
          A5S_IMAGE="$IMAGE:$VERSION" sh deploy/smoke.sh
      - name: Push it
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          echo "DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" >> "$GITHUB_ENV"
      - name: Sign its provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Publish the release, with the manifest the image was built with
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --entrypoint cat "$IMAGE@$DIGEST" /app/release.yaml > release.yaml
          gh release create "$GITHUB_REF_NAME" release.yaml --title "a5s $VERSION" --notes "\
          The image is $IMAGE@$DIGEST. Check where it was built from with
          \`gh attestation verify oci://$IMAGE@$DIGEST --owner $GITHUB_REPOSITORY_OWNER\`.

          release.yaml is the manifest it was built with. To approve the release for your
          deployment, its approvers sign what \`a5s release show\` prints there, which adds
          your own models, scenario and agents, and your administrator records their
          signatures with \`a5s release approve\`."
